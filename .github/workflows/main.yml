name: Build ViPER Player APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: viperplayer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses </dev/null || true

          sdkmanager \
            "platforms;android-37" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare signing keystore
        shell: bash
        env:
          B64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          S_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          S_KPASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          S_SPASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$B64" ]; then

            echo "$B64" | base64 --decode > release.jks

            ALIAS="$S_ALIAS"
            KPASS="$S_KPASS"
            SPASS="$S_SPASS"

          else

            echo "::warning::Using temporary signing keystore"

            keytool -genkeypair \
              -keystore release.jks \
              -alias viper \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass viper123 \
              -keypass viper123 \
              -dname "CN=ViPERPlayer"

            ALIAS=viper
            KPASS=viper123
            SPASS=viper123

          fi

          {
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KPASS"
            echo "SIGNING_STORE_PASSWORD=$SPASS"
            echo "SIGNING_KEY_STORE_PATH=$GITHUB_WORKSPACE/release.jks"
          } >> "$GITHUB_ENV"

      - name: Verify repository configuration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Java:"
          java -version

          echo "Gradle:"
          ./gradlew --version

          echo "Git submodules:"
          git submodule status

          echo "Android SDK:"
          ls "$ANDROID_HOME/platforms"

      - name: Build Release APK
        id: release
        shell: bash
        run: |
          set +e

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            --console=plain \
            2>&1 | tee build-release.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then

            if grep -qiE \
              "Could not (GET|resolve)|timed out|Connection reset|Connection refused|Premature end|503|502" \
              build-release.log; then

              echo "::warning::Network error. Retrying Release."

              cp build-release.log build-release-attempt1.log

              ./gradlew \
                :app:assembleRelease \
                --stacktrace \
                --no-daemon \
                --console=plain \
                2>&1 | tee build-release.log

              RESULT=${PIPESTATUS[0]}

            fi
          fi

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

          exit "$RESULT"

      - name: Build Debug APK fallback
        if: failure() && steps.release.outcome == 'failure'
        shell: bash
        run: |
          set +e

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain \
            2>&1 | tee build-debug.log

          exit ${PIPESTATUS[0]}

      - name: Sign unsigned Release APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          AS=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n1)

          if [ -z "$AS" ]; then
            echo "::warning::apksigner not found"
            exit 0
          fi

          shopt -s nullglob

          for f in app/build/outputs/apk/release/*-unsigned.apk; do

            "$AS" sign \
              --ks release.jks \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$SIGNING_KEY_PASSWORD" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --out "${f%-unsigned.apk}-signed.apk" \
              "$f"

          done

      - name: Verify generated APK
        if: always()
        shell: bash
        run: |
          echo "Searching APK files..."

          find app/build/outputs/apk \
            -type f -name '*.apk' -print || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViPERPlayer-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Generate build diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          OUT=diagnostico.md

          {
            echo "# ViPER Player Build Diagnostics"
            echo ""
            echo "## Build result"
            echo ""

            if find app/build/outputs/apk \
              -name '*.apk' -type f | grep -q .; then

              echo "APK files generated:"
              find app/build/outputs/apk \
                -name '*.apk' -type f

            else
              echo "No APK generated."
            fi

            echo ""
            echo "## Kotlin compiler errors"
            echo ""

            if [ -f build-release.log ]; then

              grep -n -B 5 -A 12 \
                -E '^e: |^w: |compileReleaseKotlin|Execution failed for task' \
                build-release.log | tail -n 150

            fi

            echo ""
            echo "## Gradle failure details"
            echo ""

            if [ -f build-release.log ]; then

              grep -n -B 5 -A 15 \
                -E 'What went wrong|Caused by:|BUILD FAILED' \
                build-release.log | tail -n 150

            fi

          } > "$OUT"

          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViPERPlayer-Build-Logs
          path: |
            build-release.log
            build-release-attempt1.log
            build-debug.log
            diagnostico.md
          if-no-files-found: ignore
